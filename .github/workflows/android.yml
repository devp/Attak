name: "Build Android APK"

env:
  GODOT_VERSION: 4.4.1

on:
  workflow_dispatch:
  push:
    tags:
      - "android-*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest runners already ship an Android SDK (ANDROID_HOME set, with
      # build-tools and platform-tools), which is all the Android tooling the
      # non-Gradle export path needs. That is why this doesn't use the
      # barichello/godot-ci image the web workflow uses -- its Android SDK
      # contents aren't guaranteed.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates

          curl -fsSL -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

          curl -fsSL -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Build APKs
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT" tools/build-apk.sh
          # Universal build, matching what upstream ships.
          PRESET="Android" tools/build-apk.sh "$PWD/build/android/Attak.apk"
          # arm64-only, roughly half the size and easier to pull onto a phone.
          PRESET="Android arm64" tools/build-apk.sh "$PWD/build/android/Attak_arm64.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Attak-apk
          path: build/android/*.apk
          if-no-files-found: error

      - name: Attach APKs to prerelease
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/*.apk
          prerelease: true
          fail_on_unmatched_files: true
