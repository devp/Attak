name: "Build apps (copy)"

# Android builds with a bundled engine: upstream syntaks, unmodified, built as a
# plain executable and shipped in the APK as lib/<abi>/libsyntaks.so (see
# addons/attak_engines), so the Vs Bot tab can spawn it with
# OS.execute_with_pipe. See tools/build-syntaks.sh and tools/build-apk.sh.

env:
  GODOT_VERSION: 4.4.1
  # syntaks uses cfg_select! (stable in 1.95) and u64::isolate_lowest_one
  # (stable in 1.97). Checked: 1.94, 1.95 and 1.96 all fail to build it.
  RUST_TOOLCHAIN: 1.97.0

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-cc114f2e-jsfffp
    tags:
      - "android-*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest runners ship an Android SDK and NDK (ANDROID_HOME,
      # ANDROID_NDK_LATEST_HOME). That is why this doesn't use the
      # barichello/godot-ci image the web workflow uses -- its Android SDK
      # contents aren't guaranteed.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates

          curl -fsSL -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

          curl -fsSL -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Android only installs an update signed with the same key, so keep the
      # personal release keystore between runs instead of minting one each time.
      # (Cache entries expire after 7 days unused; then expect to uninstall once.)
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/keystores
          key: android-keystore-v1

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --target aarch64-linux-android,x86_64-linux-android
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Cache syntaks build and NNUE net
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/engines/src/target
            build/engines/net
          key: syntaks-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tools/build-syntaks.sh') }}

      # The Android builds land where addons/attak_engines picks them up.
      - name: Build syntaks (unmodified upstream)
        run: |
          set -eux
          tools/build-syntaks.sh build/engines host aarch64-linux-android x86_64-linux-android
          # Prove nothing in the checkout was edited.
          git -C build/engines/src status --porcelain --untracked-files=no
          git -C build/engines/src log -1 --format='syntaks %H %s'
          mkdir -p addons/attak_engines/bin
          cp -r build/engines/arm64-v8a build/engines/x86_64 addons/attak_engines/bin/

      # Desktop end-to-end against a native x86_64 syntaks: a full 6x6 game
      # through the Vs Bot tab, with ATTAK_ENGINE_DIR standing in for Android's
      # nativeLibraryDir. Run with the editor binary so GameState asserts are on.
      - name: Run tests
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --import
          mkdir -p build/engines/desktop
          cp build/engines/host/syntaks build/engines/desktop/libsyntaks.so
          ATTAK_ENGINE_DIR="$PWD/build/engines/desktop" \
            "$GODOT" --headless tools/teiGameTest.tscn

      - name: Build APKs
        run: |
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          # The existing "Android" preset (arm64 + armv7). syntaks rides along
          # on arm64 only; armv7 devices just don't get the Vs Bot tab.
          PRESET="Android" RELEASE=1 \
          EXPECT_LIBS="arm64-v8a/libsyntaks.so" \
            tools/build-apk.sh "$PWD/build/android/Attak.apk"

          # For the emulator job: a CI-only x86_64 copy of that preset which
          # boots straight into the full-game test (not committed).
          tools/smoke-preset.py
          PRESET="Android x86_64 (TEI smoke test)" \
          EXPECT_LIBS="x86_64/libsyntaks.so" \
            tools/build-apk.sh "$PWD/build/smoke/Attak_x86_64_tei_smoke.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Attak-apk
          path: build/android/*.apk
          if-no-files-found: error

      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: Attak-apk-smoke-x86_64
          path: build/smoke/*.apk
          if-no-files-found: error

      - name: Attach APKs to prerelease
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: build/android/*.apk
          prerelease: true
          fail_on_unmatched_files: true

  # Installs the x86_64 smoke-test APK on an emulator, where it plays a full
  # 6x6 game against the bundled engine through the Vs Bot tab. Catches
  # packaging and exec regressions without a phone; arm64 still needs a real
  # device.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download smoke-test APK
        uses: actions/download-artifact@v4
        with:
          name: Attak-apk-smoke-x86_64
          path: build/smoke

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: tools/emulator-smoke.sh build/smoke/Attak_x86_64_tei_smoke.apk 300
