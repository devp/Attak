[package]
name = "attak_taktician"
version = "0.1.0"
edition = "2021"
publish = false
description = "GDExtension exposing the Taktician Tak engine to Attak"
license = "MIT"

[lib]
# The "lib" prefix in the resulting libattak_taktician.so is required: Godot's
# Android exporter rejects native libraries whose filename does not start with
# it (see save_apk_so in platform/android/export/export_plugin.cpp).
name = "attak_taktician"
crate-type = ["cdylib"]

[dependencies]
# Pinned to Godot 4.4's API level to match the editor and export templates.
godot = { version = "0.5", features = ["api-4-4"] }

# The engine itself is Go, not Rust. build.rs compiles native/go into a c-archive
# and links it in statically; Taktician is pinned to an exact commit in
# native/go/go.mod. This crate is only the GDExtension shim around it.

[profile.release]
opt-level = 3
# No LTO. The Go c-archive arrives as opaque object code, so cross-language LTO
# would need matching bitcode from both toolchains -- not worth arranging for a
# shim that spends all its time inside Go anyway.
lto = false
# Note: panic must stay "unwind". gdext catches panics at the FFI boundary and
# reports them as Godot errors, which needs unwinding -- with panic="abort" a bad
# board size would take the whole app down instead.
